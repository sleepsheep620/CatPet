name: 打包 Mac 版

# 在网页上点一下就能用 GitHub 免费的 Mac 机器打包，
# 你的电脑和朋友的电脑都不需要装任何东西。
on:
  workflow_dispatch:

jobs:
  build-mac:
    name: 打包 ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple 芯片（M1/M2/M3/M4）
            arch: apple-silicon
          - os: macos-13        # Intel 芯片
            arch: intel

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller

      - name: 自检图形库
        run: |
          python -c "import tkinter; w=tkinter.Tk(); w.destroy(); print('Tk ok', tkinter.TkVersion)"

      - name: 打包 App
        working-directory: catpet
        run: |
          ICON=""
          if [ -f cat.icns ]; then ICON="--icon cat.icns"; fi
          python -m PyInstaller --noconfirm --windowed --name CatPet $ICON \
            --add-data "assets:assets" catpet.py

      - name: 压缩成 zip（保留结构）
        working-directory: catpet
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent CatPet.app "CatPet-${{ matrix.arch }}.zip"

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: CatPet-mac-${{ matrix.arch }}
          path: catpet/dist/CatPet-${{ matrix.arch }}.zip
          if-no-files-found: error
